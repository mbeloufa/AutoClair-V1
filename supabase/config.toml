# Ce fichier n'est copie que si le projet ne possede pas encore config.toml.
# Les deux fonctions sont deployees avec --no-verify-jwt, puis valident
# elles-memes le JWT utilisateur avec Supabase Auth.

[functions.generate-vehicle-360-report]
verify_jwt = false

[functions.refresh-vehicle-valuation]
verify_jwt = false

[functions.refresh-vehicle-maintenance-plan]
verify_jwt = true

[functions.analyze-tire-inspection]
verify_jwt = true

[functions.sync-premium-entitlement]
verify_jwt = true

[functions.analyze-smart-trip]
verify_jwt = true

[functions.analyze-legal-case]
verify_jwt = true

[functions.analyze-emergency]
verify_jwt = true

# Validated using the dedicated webhook authorization header.
[functions.revenuecat-commercial-webhook]
verify_jwt = false

# Authenticated reconciliation of consumables.
[functions.sync-commercial-purchases]
verify_jwt = true

name: AutoClair commercial SQL integration
on:
  pull_request:
    paths:
      - 'supabase/migrations/20261019000100_commercial_ledger_v1.sql'
      - 'test/sql/**'
      - '.github/workflows/commercial-sql.yml'
  workflow_dispatch:
jobs:
  ledger:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: autoclair_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d autoclair_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: autoclair_test
    steps:
      - uses: actions/checkout@v4
      - name: Bootstrap isolated test database
        run: psql -X -v ON_ERROR_STOP=1 -f test/sql/commercial_bootstrap.sql
      - name: Apply commercial migration
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261019000100_commercial_ledger_v1.sql
      - name: Verify purchases and credits
        run: psql -X -v ON_ERROR_STOP=1 -f test/sql/commercial_ledger_test.sql
